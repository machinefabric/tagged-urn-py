# The package builds the program generated from the proved model in ../formal (src/tagged_urn/_formal,
# see ../lungo.toml) with CMake, on lungo-py — at exactly the lungo release that generated it.
[build-system]
requires = ["scikit-build-core>=0.10", "lungo-py==1.86.160"]
build-backend = "scikit_build_core.build"

[project]
name = "tagged-urn"
version = "1.66.0"
description = "Tagged URN - Flat tag-based identifier system"
authors = [{name = "https://github.com/machinefabric"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["lungo-py==1.86.160"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/tagged_urn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
